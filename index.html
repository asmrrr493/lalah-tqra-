<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم Tigo</title>
  <style>
    body { font-family: Arial; text-align: center; padding: 30px; background: #111; color: white; }
    .box { background: #222; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
    input, button { padding: 12px; margin: 8px; border-radius: 8px; border: none; width: 80%; font-size: 16px; }
    button { background: orange; color: black; cursor: pointer; font-weight: bold; }
    #msg { margin-top: 15px; font-weight: bold; white-space: pre-line; }
  </style>
</head>
<body>
  <div class="box">
    <h2>تسجيل دخول الادمن</h2>
    <input id="email" type="email" placeholder="admin@tigo.com" value="admin@tigo.com"><br>
    <input id="password" type="password" placeholder="123456" value="123456"><br>
    <button id="login">دخول</button>
    <p id="msg"></p>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBFpcNjyPK1oY4AB23WcEUGIA4qRMvHzCs",
  authDomain: "bitcoin-d70e1.firebaseapp.com",
  projectId: "bitcoin-d70e1",
  storageBucket: "bitcoin-d70e1.firebasestorage.app",
  messagingSenderId: "1038875440816",
  appId: "1:1038875440816:web:1f70ae886bb792b8b4ed75"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

document.getElementById('login').onclick = async () => {
  const email = document.getElementById('email').value;
  const pass = document.getElementById('password').value;
  const msg = document.getElementById('msg');
  msg.innerText = "جاري التحقق...";
  msg.style.color = "orange";
  try {
    const userCred = await signInWithEmailAndPassword(auth, email, pass);
    msg.innerText = "1- تم تسجيل الدخول ✅\nUID: " + userCred.user.uid;
    
    const userDoc = await getDoc(doc(db, "users", userCred.user.uid));
    if(userDoc.exists()) {
      msg.innerText += "\n2- لقيت البيانات في Firestore ✅";
      msg.innerText += "\nالاسم: " + userDoc.data().name;
      msg.style.color = "lightgreen";
    } else {
      msg.innerText += "\n2- مش لاقي البيانات في Firestore ❌";
      msg.innerText += "\nروح Firestore واعمل document باسمه ده";
      msg.style.color = "red";
    }
  } catch(e){ 
    msg.innerText = "خطأ: " + e.message;
    msg.style.color = "red";
  }
}
</script>
</body>
</html>
